name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Storybook
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          # Build Storybook with explicit output directory
          npm run build-storybook:gh-pages
          # Verify the directory was created
          if [ ! -d "storybook-static" ]; then
            echo "Error: storybook-static directory not found after build"
            ls -la
            exit 1
          fi
          # Update paths for GitHub Pages
          cd storybook-static
          # Update HTML files
          find . -name "*.html" -type f -exec sed -i "s|href=\"/|href=\"/$REPO_NAME/|g" {} \;
          find . -name "*.html" -type f -exec sed -i "s|src=\"/|src=\"/$REPO_NAME/|g" {} \;
          # Update JavaScript files
          find . -name "*.js" -type f -exec sed -i "s|/static/|/$REPO_NAME/static/|g" {} \;
          find . -name "*.js" -type f -exec sed -i "s|\"/iframe.html|\"/$REPO_NAME/iframe.html|g" {} \;
          # Update JSON files
          find . -name "*.json" -type f -exec sed -i "s|\"/static/|\"/$REPO_NAME/static/|g" {} \;
          find . -name "*.json" -type f -exec sed -i "s|\"/iframe.html|\"/$REPO_NAME/iframe.html|g" {} \;

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
